<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xGRC Apple Watch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#8CC8FF}
button{font:inherit}
</style>
</helmet>
<div style="width: 1000px; height: 560px; box-sizing: border-box; padding: 40px 48px; background: #0E0F11; color: #F4F4F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">

  <header style="display: flex; justify-content: space-between; align-items: baseline; gap: 24px">
    <span style="font-size: 22px; font-weight: 600">Apple Watch · on ink-0, one idea per page</span>
    <span style="font-size: 14px; color: #868C96">45 mm · hand Double Tap = Shoot on the Shutter page only</span>
  </header>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; justify-items: center">

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 228px; height: 274px; border-radius: 58px; background: #22252A; padding: 10px; box-sizing: border-box">
        <div style="width: 208px; height: 254px; border-radius: 48px; background: #000000; box-sizing: border-box; padding: 14px 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center; padding: 0 6px"><span style="font-size: 15px; font-weight: 600">α7C II</span><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 999px; background: #2CC56A"></span></div>
          <button type="button" aria-label="Shutter" style="margin-top: 4px; width: 116px; height: 116px; border-radius: 999px; border: 6px solid #2CC56A; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
            <span style="width: 92px; height: 92px; border-radius: 999px; background: #2CC56A; color: #000000; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; font-size: 17px; font-weight: 600">✓ 13</span>
          </button>
          <span style="font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; font-size: 15px; font-weight: 500"><span style="color: #2CC56A">12 ✓</span> <span style="color: #2E3238">·</span> <span style="color: #A6ABB3">13 ↑</span></span>
          <span style="font-size: 12px; color: #868C96">tap = focus · 2× = shoot</span>
          <div aria-hidden="true" style="display: flex; gap: 5px; margin-top: auto"><span style="width: 6px; height: 6px; border-radius: 999px; background: #F4F4F2"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #2E3238"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #2E3238"></span></div>
        </div>
      </div>
      <figcaption style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">1 · Shutter</span><span style="font-size: 13px; color: #868C96">Fired, confirmed</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 228px; height: 274px; border-radius: 58px; background: #22252A; padding: 10px; box-sizing: border-box">
        <div style="width: 208px; height: 254px; border-radius: 48px; background: #000000; box-sizing: border-box; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px"><span style="color: #5AB0FF; font-size: 16px">◎</span><span style="font-size: 15px; font-weight: 600">GPS</span><span style="font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; font-size: 15px; font-weight: 500; color: #5AB0FF">±5 m</span></div>
          <span style="font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; padding: 0 4px">00:42:17</span>
          <span style="font-size: 13px; color: #A6ABB3; padding: 0 4px">Pushed <span style="font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; color: #F4F4F2">9 s</span> ago · <span style="font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; color: #F4F4F2">312</span></span>
          <button type="button" style="margin-top: 6px; min-height: 48px; border-radius: 999px; border: 1px solid #FF6A4D; background: transparent; color: #FF6A4D; font-size: 16px; font-weight: 600">Stop</button>
          <div aria-hidden="true" style="display: flex; gap: 5px; margin-top: auto; justify-content: center"><span style="width: 6px; height: 6px; border-radius: 999px; background: #2E3238"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #F4F4F2"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #2E3238"></span></div>
        </div>
      </div>
      <figcaption style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">2 · Geotag</span><span style="font-size: 13px; color: #868C96">Session time, push age, pushes</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 228px; height: 274px; border-radius: 58px; background: #22252A; padding: 10px; box-sizing: border-box">
        <div style="width: 208px; height: 254px; border-radius: 48px; background: #000000; box-sizing: border-box; padding: 16px 12px 10px; display: flex; flex-direction: column; gap: 6px">
          <button type="button" style="min-height: 44px; border-radius: 12px; border: none; background: #17191C; color: #F4F4F2; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px">Camera<span style="color: #868C96">›</span></button>
          <button type="button" style="min-height: 44px; border-radius: 12px; border: none; background: #17191C; color: #F4F4F2; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px">Delay<span style="font-family: ui-monospace, 'SF Mono', 'Geist Mono', monospace; color: #FFB020">10 s ›</span></button>
          <button type="button" style="min-height: 44px; border-radius: 12px; border: none; background: #17191C; color: #F4F4F2; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px">Mode<span style="color: #868C96">›</span></button>
          <button type="button" style="min-height: 44px; border-radius: 12px; border: none; background: #17191C; color: #FF6A4D; font-size: 15px; font-weight: 600; text-align: left; padding: 0 12px">End session</button>
          <div aria-hidden="true" style="display: flex; gap: 5px; margin-top: auto; justify-content: center"><span style="width: 6px; height: 6px; border-radius: 999px; background: #2E3238"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #2E3238"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: #F4F4F2"></span></div>
        </div>
      </div>
      <figcaption style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 15px; font-weight: 600">3 · Settings</span><span style="font-size: 13px; color: #868C96">Delay set with the Digital Crown</span></figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
